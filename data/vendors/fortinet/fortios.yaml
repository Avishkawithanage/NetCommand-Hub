        example: fgt-hq-01.conf
      tftp_server:
        type: ipv4
        label: TFTP server
        example: 192.0.2.10
    template: |
      execute backup config tftp {{filename}} {{tftp_server}}
    explanation:
      - { line: "execute backup config tftp", text: "Exports the configuration. TFTP is unencrypted; prefer a protected transfer such as SCP or the GUI download." }
    expected_outcome: The file appears on the server.
