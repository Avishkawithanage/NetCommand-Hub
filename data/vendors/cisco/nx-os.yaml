# Cisco NX-OS templates. All "unverified": not reviewed against documentation or lab-tested.
# NX-OS is NOT IOS: many features must be enabled with "feature ..." first and IP addresses use CIDR notation.
vendor: cisco
platforms: [nx-os]
os_versions: []
compatibility_note: >-
  Written to common NX-OS CLI conventions for Nexus switches. Exact release and model support has NOT been verified.
  Some commands depend on licensing and platform capabilities.
templates:
  - id: vlan-create
    title: Create a VLAN
    category: vlan
    task: create_vlan
    summary: Create a VLAN and give it a name.
    difficulty: beginner
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - Confirm the VLAN ID is allowed by the network design.
    placeholders:
      vlan_id:
        type: integer
        label: VLAN ID
        min: 1
        max: 4094
        example: "10"
      vlan_name:
        type: string
        label: VLAN name
        pattern: '^[A-Za-z0-9_\-]{1,32}$'
        max_length: 32
        example: SERVERS
    template: |
      vlan {{vlan_id}}
        name {{vlan_name}}
    explanation:
      - { line: "vlan {{vlan_id}}", text: "Creates the VLAN and enters VLAN configuration mode." }
    expected_outcome: The VLAN exists with the chosen name.
    verification_commands:
      - show vlan brief
      - show vlan id {{vlan_id}}
    rollback_notes: Use "no vlan <id>" after removing the VLAN from all interfaces.
    warnings:
      - VLANs 3968-4047 and 4094 are reserved on many Nexus platforms. Check your model.
    tags: [vlan]
    related: [access-port, trunk-port]

  - id: access-port
    title: Configure an access port in a VLAN
    category: switchport
    task: configure_access_port
    summary: Set a layer-2 interface as an access port in one VLAN.
    difficulty: beginner
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - The VLAN exists.
    placeholders:
      interface:
        type: string
        label: Interface
        pattern: '^[A-Za-z][A-Za-z\-]{1,30}[0-9]+(/[0-9]+){0,3}$'
        max_length: 40
        example: Ethernet1/5
      vlan_id:
        type: integer
        label: VLAN ID
        min: 1
        max: 4094
        example: "10"
      description:
        type: string
        label: Description
        max_length: 60
        example: Server A
    template: |
      interface {{interface}}
        description {{description}}
        switchport
        switchport mode access
        switchport access vlan {{vlan_id}}
        no shutdown
    explanation:
      - { line: "switchport", text: "Makes the port layer-2 (some Nexus ports default to routed)." }
      - { line: "switchport access vlan {{vlan_id}}", text: "Assigns the VLAN." }
    expected_outcome: The port is a member of the VLAN.
    verification_commands:
      - show interface {{interface}} switchport
      - show vlan brief
    rollback_notes: Restore the previous VLAN assignment.
    warnings:
      - Changing a live port interrupts the connected device.
    tags: [access, switchport]
    related: [vlan-create]

  - id: trunk-port
    title: Configure a trunk port
    category: switchport
    task: configure_trunk_port
    summary: Set an interface as an 802.1Q trunk with an allowed VLAN list.
    difficulty: intermediate
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - Remote end is configured to match.
    placeholders:
      interface:
        type: string
        label: Interface
        pattern: '^[A-Za-z][A-Za-z\-]{1,30}[0-9]+(/[0-9]+){0,3}$'
        max_length: 40
        example: Ethernet1/48
      allowed_vlans:
        type: vlan_list
        label: Allowed VLANs
        example: 10,20,30-40
    template: |
      interface {{interface}}
        switchport
        switchport mode trunk
        switchport trunk allowed vlan {{allowed_vlans}}
        no shutdown
    explanation:
      - { line: "switchport trunk allowed vlan {{allowed_vlans}}", text: "Replaces the allowed list with this list." }
    expected_outcome: The interface trunks only the listed VLANs.
    verification_commands:
      - show interface trunk
      - show interface {{interface}} switchport
    rollback_notes: Re-apply the previous allowed list or use the "add" keyword to extend it.
    warnings:
      - Replacing the allowed list on a live uplink can cut off VLANs and your management access.
    tags: [trunk, 802.1q]
    related: [vlan-create, lacp-port-channel]

  - id: lacp-port-channel
    title: Add an interface to an LACP port-channel
    category: lag
    task: configure_port_channel
    summary: Enable LACP and add one member interface to a port-channel.
    difficulty: intermediate
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - LACP feature licence/availability confirmed. Repeat the interface block for every member.
      - Member ports must have identical settings.
    placeholders:
      interface:
        type: string
        label: Member interface
        pattern: '^[A-Za-z][A-Za-z\-]{1,30}[0-9]+(/[0-9]+){0,3}$'
        max_length: 40
        example: Ethernet1/1
      channel_group:
        type: integer
        label: Channel group
        min: 1
        max: 4096
        example: "10"
      lacp_mode:
        type: enum
        label: LACP mode
        options: [active, passive]
        default: active
    template: |
      feature lacp
      interface {{interface}}
        channel-group {{channel_group}} mode {{lacp_mode}}
        no shutdown
    explanation:
      - { line: "feature lacp", text: "Enables LACP on NX-OS." }
      - { line: "channel-group ... mode ...", text: "Adds the interface to the port-channel, creating it if needed." }
    expected_outcome: Port-channel forms when the remote side matches.
    verification_commands:
      - show port-channel summary
      - show lacp neighbor
    rollback_notes: Remove the member with "no channel-group" on the interface.
    warnings:
      - Changing members on a live link causes a short outage.
    tags: [lacp, port-channel, lag]
    related: [trunk-port]

  - id: svi-ip
    title: Create a VLAN interface (SVI) with an IPv4 address
    category: ip-addressing
    task: configure_svi
    summary: Enable interface-vlan and give a VLAN an IPv4 gateway address.
    difficulty: intermediate
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - The VLAN exists.
    placeholders:
      vlan_id:
        type: integer
        label: VLAN ID
        min: 1
        max: 4094
        example: "10"
      address:
        type: ipv4_cidr
        label: Address / prefix
        example: 192.168.10.1/24
    template: |
      feature interface-vlan
      interface Vlan{{vlan_id}}
        ip address {{address}}
        no shutdown
    explanation:
      - { line: "feature interface-vlan", text: "Required on NX-OS before creating SVIs." }
      - { line: "ip address {{address}}", text: "NX-OS uses CIDR notation." }
    expected_outcome: The SVI comes up when the VLAN has an active port.
    verification_commands:
      - show ip interface brief
      - show interface Vlan{{vlan_id}}
    rollback_notes: Use "no interface Vlan<id>".
    warnings:
      - The address must not overlap another interface subnet.
    tags: [svi, ip address]
    related: [vlan-create, static-route]

  - id: static-route
    title: Add an IPv4 static route
    category: static-routing
    task: configure_static_route
    summary: Add a static route using CIDR notation.
    difficulty: beginner
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - The next hop is reachable.
    placeholders:
      prefix:
        type: ipv4_cidr
        label: Destination prefix
        description: Use 0.0.0.0/0 for a default route.
        allow_host_bits: false
        example: 10.20.0.0/16
      next_hop:
        type: ipv4
        label: Next hop
        example: 192.168.1.254
    template: |
      ip route {{prefix}} {{next_hop}}
    explanation:
      - { line: "ip route {{prefix}} {{next_hop}}", text: "Installs a static route." }
    expected_outcome: The route appears as static in the routing table.
    verification_commands:
      - show ip route static
      - show ip route {{prefix}}
    rollback_notes: Remove with "no ip route ...".
    warnings:
      - A wrong default route can break management connectivity.
    tags: [static route, routing]
    related: [svi-ip, ospf-basic]

  - id: ospf-basic
    title: Enable OSPF on an interface
    category: ospf
    task: configure_ospf
    summary: Enable the OSPF feature, set a router ID and enable OSPF on an interface in an area.
    difficulty: intermediate
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - The interface has an IPv4 address.
    placeholders:
      process_tag:
        type: string
        label: Process tag
        pattern: '^[A-Za-z0-9_\-]{1,20}$'
        max_length: 20
        example: "1"
      router_id:
        type: ipv4
        label: Router ID
        example: 1.1.1.1
      interface:
        type: string
        label: Interface
        pattern: '^[A-Za-z][A-Za-z\-]{1,30}[0-9]+(/[0-9]+){0,3}$'
        max_length: 40
        example: Vlan10
      area:
        type: integer
        label: Area
        min: 0
        max: 4294967295
        example: "0"
    template: |
      feature ospf
      router ospf {{process_tag}}
        router-id {{router_id}}
      interface {{interface}}
        ip router ospf {{process_tag}} area {{area}}
    explanation:
      - { line: "ip router ospf ... area ...", text: "NX-OS enables OSPF per interface rather than with a network statement." }
    expected_outcome: OSPF adjacencies form with neighbours on that interface.
    verification_commands:
      - show ip ospf neighbors
      - show ip ospf interface brief
    rollback_notes: Remove with "no ip router ospf <tag> area <area>" on the interface.
    warnings:
      - The area number is entered as given; some releases display it in dotted form.
    tags: [ospf, routing]
    related: [static-route]

  - id: ssh-access
    title: Enable SSH on NX-OS
    category: management
    task: configure_ssh
    summary: Enable the SSH feature and generate an RSA key.
    difficulty: intermediate
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - A local user with a strong password already exists (create separately).
    placeholders:
      hostname:
        type: string
        label: Hostname
        pattern: '^[A-Za-z0-9][A-Za-z0-9\-]{0,62}$'
        max_length: 63
        example: NX-CORE-01
    template: |
      hostname {{hostname}}
      feature ssh
      ssh key rsa 2048
    explanation:
      - { line: "feature ssh", text: "Enables the SSH server (it is usually enabled by default)." }
      - { line: "ssh key rsa 2048", text: "Generates the host key. The device may ask before overwriting an existing key." }
    expected_outcome: SSH logins work with a local account.
    verification_commands:
      - show ssh server
      - show ssh key
    rollback_notes: Use "no feature ssh" only if you have console access.
    warnings:
      - Disabling SSH remotely can lock you out.
    tags: [ssh, management]
    related: []

  - id: save-config
    title: Save the running configuration
    category: save-verify
    task: save_config
    kind: operational
    summary: Copy the running configuration to the startup configuration.
    difficulty: beginner
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - Verify the running configuration first.
    template: |
      copy running-config startup-config
    explanation:
      - { line: "copy running-config startup-config", text: "Persists the configuration across reloads." }
    expected_outcome: The device reports the copy completed.
    verification_commands:
      - show startup-config
    rollback_notes: Keep a backup of the previous startup configuration.
    warnings:
      - Saving a faulty configuration makes it persist after a reload.
    tags: [save, startup-config]
    related: []

  - id: interface-health-show
    title: Check interface status and errors
    category: troubleshooting
    task: show_interface_errors
    kind: show
    summary: Read-only commands to review interface status and error counters.
    difficulty: beginner
    verification_status: unverified
    added_at: 2026-10-18
    placeholders:
      interface:
        type: string
        label: Interface
        pattern: '^[A-Za-z][A-Za-z\-]{1,30}[0-9]+(/[0-9]+){0,3}$'
        max_length: 40
        example: Ethernet1/1
    template: |
      show interface status
      show interface {{interface}}
      show interface counters errors
    explanation:
      - { line: "show interface counters errors", text: "Error counters per interface." }
    expected_outcome: Read-only output.
    verification_commands: []
    tags: [show, interface, errors, troubleshooting]
    related: []
