# Dell SmartFabric OS10 templates. All "unverified": not reviewed against Dell documentation or lab-tested.
# OS10 is NOT OS9 or OS6. Interface names look like "ethernet 1/1/1" and addresses use CIDR notation.
vendor: dell
platforms: [os10]
os_versions: []
compatibility_note: >-
  Written to common Dell SmartFabric OS10 CLI conventions. Exact OS10 release and PowerSwitch model support has
  NOT been verified. Do not use on OS9 or OS6 devices.
templates:
  - id: hostname-basics
    title: Set the hostname
    category: basics
    task: set_hostname
    summary: Set the device hostname.
    difficulty: beginner
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - Enter configuration mode with "configure terminal".
    placeholders:
      hostname:
        type: string
        label: Hostname
        pattern: '^[A-Za-z0-9][A-Za-z0-9\-]{0,62}$'
        max_length: 63
        example: OS10-LEAF-01
    template: |
      hostname {{hostname}}
    explanation:
      - { line: "hostname {{hostname}}", text: "Sets the device name shown in the prompt." }
    expected_outcome: The prompt shows the new hostname.
    verification_commands:
      - show running-configuration | grep hostname
    rollback_notes: Re-enter the previous hostname.
    tags: [hostname, basics]
    related: []

  - id: vlan-create
    title: Create a VLAN interface
    category: vlan
    task: create_vlan
    summary: Create a VLAN with a description.
    difficulty: beginner
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - Confirm the VLAN ID is allowed by the design.
    placeholders:
      vlan_id:
        type: integer
        label: VLAN ID
        min: 1
        max: 4093
        example: "10"
      vlan_name:
        type: string
        label: Description
        max_length: 60
        example: USERS
    template: |
      interface vlan {{vlan_id}}
       description {{vlan_name}}
       no shutdown
    explanation:
      - { line: "interface vlan {{vlan_id}}", text: "Creates the VLAN. In OS10 a VLAN is created as an interface." }
    expected_outcome: The VLAN is listed in "show vlan".
    verification_commands:
      - show vlan
    rollback_notes: Use "no interface vlan <id>" after removing it from all ports.
    warnings:
      - VLAN 4094 is reserved by OS10 for internal use. Check your release for other reserved IDs.
    tags: [vlan]
    related: [access-port, trunk-port]

  - id: access-port
    title: Configure an access port in a VLAN
    category: switchport
    task: configure_access_port
    summary: Set an interface as an untagged access port in a VLAN.
    difficulty: beginner
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - The VLAN exists.
    placeholders:
      interface:
        type: string
        label: Interface
        description: As typed after "interface", e.g. ethernet 1/1/5.
        pattern: '^ethernet [0-9]+/[0-9]+/[0-9]+(:[0-9]+)?$'
        max_length: 30
        example: ethernet 1/1/5
      vlan_id:
        type: integer
        label: VLAN ID
        min: 1
        max: 4093
        example: "10"
    template: |
      interface {{interface}}
       no shutdown
       switchport mode access
       switchport access vlan {{vlan_id}}
    explanation:
      - { line: "switchport mode access", text: "Converts the port to a layer-2 access port. OS10 ports are routed by default." }
      - { line: "switchport access vlan {{vlan_id}}", text: "Places the port in the VLAN as untagged." }
    expected_outcome: The port is an untagged member of the VLAN.
    verification_commands:
      - show vlan
      - show interface {{interface}}
    rollback_notes: Restore the previous port mode and VLAN.
    warnings:
      - Changing a live port interrupts the connected device.
    tags: [access, switchport]
    related: [vlan-create]

  - id: trunk-port
    title: Configure a trunk port
    category: switchport
    task: configure_trunk_port
    summary: Set an interface as a trunk carrying tagged VLANs.
    difficulty: intermediate
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - The remote end is configured to match.
    placeholders:
      interface:
        type: string
        label: Interface
        pattern: '^ethernet [0-9]+/[0-9]+/[0-9]+(:[0-9]+)?$'
        max_length: 30
        example: ethernet 1/1/48
      allowed_vlans:
        type: vlan_list
        label: Allowed VLANs
        example: 10,20,30-40
    template: |
      interface {{interface}}
       no shutdown
       switchport mode trunk
       switchport trunk allowed vlan {{allowed_vlans}}
    explanation:
      - { line: "switchport trunk allowed vlan {{allowed_vlans}}", text: "Adds the VLANs as tagged on this port." }
    expected_outcome: The VLANs are tagged members of the port.
    verification_commands:
      - show vlan
      - show interface {{interface}}
    rollback_notes: Remove the VLANs with "no switchport trunk allowed vlan <list>".
    warnings:
      - Changes on a live uplink can cut off traffic and your management access.
    tags: [trunk, 802.1q]
    related: [vlan-create, lag-lacp]

  - id: lag-lacp
    title: Create an LACP port-channel (LAG)
    category: lag
    task: configure_lag
    summary: Create a trunk port-channel and add one member interface using LACP.
    difficulty: intermediate
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - Repeat the member interface block for every member.
      - Verify the member-port steps against your OS10 release - some releases require "no switchport" on the member.
    placeholders:
      channel_group:
        type: integer
        label: Port-channel number
        min: 1
        max: 128
        example: "1"
      allowed_vlans:
        type: vlan_list
        label: Allowed VLANs on the LAG
        example: 10,20
      member:
        type: string
        label: Member interface
        pattern: '^ethernet [0-9]+/[0-9]+/[0-9]+(:[0-9]+)?$'
        max_length: 30
        example: ethernet 1/1/1
      lacp_mode:
        type: enum
        label: LACP mode
        options: [active, passive]
        default: active
    template: |
      interface port-channel {{channel_group}}
       no shutdown
       switchport mode trunk
       switchport trunk allowed vlan {{allowed_vlans}}
      !
      interface {{member}}
       no shutdown
       no switchport
       channel-group {{channel_group}} mode {{lacp_mode}}
    explanation:
      - { line: "interface port-channel {{channel_group}}", text: "Creates the logical LAG interface." }
      - { line: "channel-group {{channel_group}} mode {{lacp_mode}}", text: "Adds the member and negotiates with LACP." }
    expected_outcome: The LAG comes up once the peer is configured.
    verification_commands:
      - show port-channel summary
      - show interface port-channel {{channel_group}}
    rollback_notes: Remove with "no channel-group" on the members, then "no interface port-channel <n>".
    warnings:
      - Moving live links into a LAG causes a short outage.
    tags: [lag, lacp, port-channel]
    related: [trunk-port]

  - id: svi-ip
    title: Assign an IPv4 address to a VLAN interface
    category: ip-addressing
    task: configure_svi
    summary: Give a VLAN a layer-3 gateway address.
    difficulty: intermediate
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - The VLAN exists.
    placeholders:
      vlan_id:
        type: integer
        label: VLAN ID
        min: 1
        max: 4093
        example: "10"
      address:
        type: ipv4_cidr
        label: Address / prefix
        example: 192.168.10.1/24
    template: |
      interface vlan {{vlan_id}}
       ip address {{address}}
       no shutdown
    explanation:
      - { line: "ip address {{address}}", text: "OS10 uses CIDR notation." }
    expected_outcome: The VLAN interface has the address and is up.
    verification_commands:
      - show ip interface brief
    rollback_notes: Use "no ip address".
    warnings:
      - The address must not overlap another interface.
    tags: [svi, ip address]
    related: [vlan-create, static-route]

  - id: static-route
    title: Add an IPv4 static route
    category: static-routing
    task: configure_static_route
    summary: Add a static route using CIDR notation.
    difficulty: beginner
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - The next hop is on a connected network.
    placeholders:
      prefix:
        type: ipv4_cidr
        label: Destination prefix
        allow_host_bits: false
        example: 10.20.0.0/16
      next_hop:
        type: ipv4
        label: Next hop
        example: 192.168.1.254
    template: |
      ip route {{prefix}} {{next_hop}}
    explanation:
      - { line: "ip route {{prefix}} {{next_hop}}", text: "Installs the static route." }
    expected_outcome: The route is listed as static.
    verification_commands:
      - show ip route
    rollback_notes: Remove with "no ip route ...".
    warnings:
      - A wrong default route can break management connectivity.
    tags: [static route, routing]
    related: [svi-ip, ospf-basic]

  - id: ospf-basic
    title: Enable OSPF on a VLAN interface
    category: ospf
    task: configure_ospf
    summary: Create an OSPF process with a router ID and enable it on a VLAN interface.
    difficulty: intermediate
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - The VLAN interface has an IPv4 address.
    placeholders:
      process_id:
        type: integer
        label: Process ID
        min: 1
        max: 65535
        example: "1"
      router_id:
        type: ipv4
        label: Router ID
        example: 1.1.1.1
      vlan_id:
        type: integer
        label: VLAN ID
        min: 1
        max: 4093
        example: "10"
      area:
        type: integer
        label: Area
        min: 0
        max: 4294967295
        example: "0"
    template: |
      router ospf {{process_id}}
       router-id {{router_id}}
      !
      interface vlan {{vlan_id}}
       ip ospf {{process_id}} area {{area}}
    explanation:
      - { line: "ip ospf {{process_id}} area {{area}}", text: "OS10 enables OSPF per interface." }
    expected_outcome: OSPF neighbours form on the interface.
    verification_commands:
      - show ip ospf neighbor
      - show ip route ospf
    rollback_notes: Remove with "no ip ospf <process> area <area>" and "no router ospf <process>".
    tags: [ospf, routing]
    related: [static-route]

  - id: stp-rstp
    title: Use RSTP and set the bridge priority
    category: stp
    task: configure_stp
    summary: Set RSTP mode and bridge priority.
    difficulty: intermediate
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - Know the intended root bridge.
    placeholders:
      priority:
        type: integer
        label: Bridge priority
        description: Multiple of 4096; lower is preferred.
        min: 0
        max: 61440
        multiple_of: 4096
        example: "4096"
    template: |
      spanning-tree mode rstp
      spanning-tree rstp priority {{priority}}
    explanation:
      - { line: "spanning-tree rstp priority {{priority}}", text: "Lower values are more likely to become root." }
    expected_outcome: The switch becomes root if its priority is lowest.
    verification_commands:
      - show spanning-tree brief
    rollback_notes: Restore the default priority (32768).
    warnings:
      - Changing the root bridge changes traffic paths network-wide.
    tags: [stp, rstp]
    related: []

  - id: acl-ip-tcp
    title: IP ACL permitting TCP to a host, applied to a VLAN interface
    category: acl
    task: configure_acl
    summary: Create an IPv4 ACL permitting one TCP service and apply it inbound.
    difficulty: intermediate
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - Console access in case you block your own session.
    placeholders:
      acl_name:
        type: string
        label: ACL name
        pattern: '^[A-Za-z][A-Za-z0-9_\-]{0,30}$'
        max_length: 31
        example: ALLOW-SSH
      source:
        type: ipv4_cidr
        label: Source network
        allow_host_bits: false
        example: 10.0.0.0/24
      dest_host:
        type: ipv4
        label: Destination host
        example: 192.168.10.10
      port:
        type: integer
        label: TCP port
        min: 1
        max: 65535
        example: "22"
      vlan_id:
        type: integer
        label: VLAN interface
        min: 1
        max: 4093
        example: "10"
    template: |
      ip access-list {{acl_name}}
       seq 10 permit tcp {{source}} host {{dest_host}} eq {{port}}
      !
      interface vlan {{vlan_id}}
       ip access-group {{acl_name}} in
    explanation:
      - { line: "seq 10 permit tcp ...", text: "Permits the TCP service; other traffic is subject to the ACL's implicit deny." }
    expected_outcome: Only matching traffic is accepted inbound on the VLAN interface.
    verification_commands:
      - show ip access-lists {{acl_name}}
    rollback_notes: Remove "ip access-group" from the interface first.
    warnings:
      - The implicit deny will block all other inbound traffic on the interface.
    tags: [acl, filtering]
    related: [svi-ip]

  - id: ntp-server
    title: Configure an NTP server
    category: time-logging
    task: configure_ntp
    summary: Synchronise the device clock.
    difficulty: beginner
    verification_status: unverified
    added_at: 2026-10-18
    prerequisites:
      - The NTP server is reachable.
    placeholders:
      ntp_server:
        type: ipv4
        label: NTP server
        example: 192.0.2.123
    template: |
      ntp server {{ntp_server}}
    explanation:
      - { line: "ntp server {{ntp_server}}", text: "Sets the time source." }
    expected_outcome: The clock synchronises after a few minutes.
    verification_commands:
      - show ntp associations
    rollback_notes: Remove with "no ntp server <ip>".
    tags: [ntp, time]
    related: []

  - id: save-config
    title: Save the running configuration
    category: save-verify
    task: save_config
    kind: operational
    summary: Copy the running configuration to the startup configuration.
    difficulty: beginner
    verification_status: unverified
    added_at: 2026-10-18
    template: |
      copy running-configuration startup-configuration
    explanation:
      - { line: "copy running-configuration startup-configuration", text: "OS10 spells out 'configuration'. 'write memory' is an alias on many releases." }
    expected_outcome: The configuration is persisted.
    verification_commands:
      - show startup-configuration
    rollback_notes: Keep a backup of the previous startup configuration.
    warnings:
      - Saving a faulty configuration makes it persist after reload.
    tags: [save, startup-config]
    related: []

  - id: health-show
    title: Check interface and VLAN status
    category: troubleshooting
    task: show_interface_errors
    kind: show
    summary: Read-only commands to review interfaces, VLANs and port-channels.
    difficulty: beginner
    verification_status: unverified
    added_at: 2026-10-18
    placeholders:
      interface:
        type: string
        label: Interface
        pattern: '^ethernet [0-9]+/[0-9]+/[0-9]+(:[0-9]+)?$'
        max_length: 30
        example: ethernet 1/1/1
    template: |
      show interface status
      show interface {{interface}}
      show vlan
      show port-channel summary
    explanation:
      - { line: "show interface {{interface}}", text: "Detailed state and counters, including errors, for one port." }
    expected_outcome: Read-only output.
    verification_commands: []
    tags: [show, interface, errors, troubleshooting]
    related: []
