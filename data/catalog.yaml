    description: Creating and naming VLANs.
  - id: switchport
    name: Access and trunk ports
    description: Assigning ports to VLANs and carrying multiple VLANs.
  - id: lag
    name: Link aggregation
    description: EtherChannel, Port-Channel, LAG and Eth-Trunk.
  - id: stp
    name: Spanning Tree
    description: STP mode and root-bridge priority.
  - id: ip-addressing
    name: IPv4 addressing
    description: Assigning IPv4 addresses to interfaces and SVIs.
  - id: static-routing
    name: Static routing
    description: Static and default routes.
  - id: ospf
    name: OSPF
    description: OSPF routing.
  - id: bgp
    name: BGP
    description: BGP neighbours and advertised networks.
  - id: acl
    name: ACL
    description: Access control lists and their application.
  - id: nat
    name: NAT
    description: Network address translation.
  - id: dhcp
    name: DHCP
    description: DHCP servers and pools.
  - id: management
    name: Management access
    description: SSH and administrative access.
  - id: time-logging
    name: NTP and logging
    description: Time synchronisation and syslog.
  - id: save-verify
    name: Save and verify
    description: Saving configuration and show/display verification commands.
  - id: backup
    name: Backup and recovery
    description: Configuration backup guidance.
  - id: firewall-policy
    name: Firewall policies
    description: Firewall policies and policy objects.
  - id: objects
    name: Address and service objects
    description: Reusable address and service objects.
  - id: vpn
