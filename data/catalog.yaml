vendors:
  - id: cisco
    name: Cisco
    description: Cisco IOS, IOS-XE and NX-OS switches and routers.
    website_url: https://www.cisco.com
  - id: dell
    name: Dell
    description: Dell Networking switches running OS6, OS9 and SmartFabric OS10. Syntax differs between these operating systems.
    website_url: https://www.dell.com
  - id: huawei
    name: Huawei
    description: Huawei switches and routers running VRP (Versatile Routing Platform).
    website_url: https://www.huawei.com
  - id: fortinet
    name: Fortinet
    description: FortiGate firewalls running FortiOS.
    website_url: https://www.fortinet.com

platforms:
  - id: ios
    vendor: cisco
    name: Cisco IOS
    os_family: IOS
    version_notes: Classic IOS on Catalyst switches and ISR routers. Exact release support is not verified per template.
  - id: ios-xe
    vendor: cisco
    name: Cisco IOS-XE
    os_family: IOS-XE
    version_notes: IOS-XE on Catalyst 9000, ISR/ASR and similar. Exact release support is not verified per template.
  - id: nx-os
    vendor: cisco
    name: Cisco NX-OS
    os_family: NX-OS
    version_notes: Nexus data-centre switches. Many features require "feature" commands first. Not interchangeable with IOS/IOS-XE.
  - id: os6
    vendor: dell
    name: Dell Networking OS6
    os_family: OS6
    version_notes: Dell N-Series / PowerConnect-era switches. Do not assume OS9 or OS10 syntax applies.
  - id: os9
    vendor: dell
    name: Dell Networking OS9
    os_family: OS9
    version_notes: Dell S-Series / Z-Series (formerly FTOS). Do not assume OS6 or OS10 syntax applies.
  - id: os10
    vendor: dell
    name: Dell SmartFabric OS10
    os_family: OS10
    version_notes: Dell PowerSwitch (S/Z/N-Series on OS10). Do not assume OS6 or OS9 syntax applies.
  - id: vrp
    vendor: huawei
    name: Huawei VRP
    os_family: VRP
    version_notes: Command availability varies by product and VRP version (V100R/V200R/V600R). Verify on your device.
  - id: fortios
    vendor: fortinet
    name: FortiGate FortiOS
    os_family: FortiOS
    version_notes: CLI syntax varies by FortiOS version and FortiGate model. Verify on your unit.

